<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="作家分析"><title>作家分析ノート</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#252923;background:#f8f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:24px 16px 90px}h1{font-size:25px;margin:4px 0}h2{font-size:17px}p,.muted{color:#727770}small{font-size:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:white;border:1px solid #e4e5df;border-radius:16px;padding:17px;margin:15px 0;box-shadow:0 2px 12px #00000006}label{display:block;font-weight:600;font-size:14px;margin:12px 0 7px}input,textarea{font:inherit;width:100%;border:1px solid #d9ddd7;background:#fff;border-radius:10px;padding:12px;color:#252923}textarea{resize:vertical;min-height:112px;line-height:1.65}button{font:inherit;border:0;background:#235a48;color:white;border-radius:10px;padding:11px 15px;cursor:pointer}button.secondary{background:#e8eee9;color:#235a48}button.ghost{background:transparent;color:#235a48;padding:8px}button.danger{background:#fff1ef;color:#a03a33}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:9px}.hidden{display:none!important}.count{font-size:13px;color:#64736c;font-variant-numeric:tabular-nums}.over{color:#c43b36!important}.meter{height:5px;background:#e7ede9;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#327963;transition:width .15s}.fill.overfill{background:#c43b36}.note{border:1px solid #e1e6df;border-radius:11px;padding:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.note strong{display:block}.note small{color:#777}.status{font-size:12px;color:#65736a}.warning{color:#ad453d}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.sectionhead label{margin:0}.section{margin:22px 0}.hint{font-size:12px;color:#777;line-height:1.7}.topgap{margin-top:14px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263b31;color:white;padding:10px 16px;border-radius:10px;max-width:90%;z-index:5;display:none}a{color:#235a48} .subtitle{margin-top:4px}
</style></head><body><main><header><div><h1>作家分析ノート</h1><p class="subtitle">好きな作家を、800字で深く知る。</p></div><button class="ghost hidden" id="logout">ログアウト</button></header>
<section class="card" id="setup"><h2>最初の設定</h2><p class="hint">Supabaseで作成したプロジェクトのURLと公開用キーを入力してください。秘密鍵（service_role）は絶対に入力しないでください。</p><label>Project URL</label><input id="url" type="url" placeholder="https://xxxx.supabase.co" autocapitalize="off"><label>Publishable key / anon public key</label><input id="key" placeholder="sb_publishable_... または eyJ..." autocapitalize="off"><button class="topgap" id="saveConfig">接続する</button><p class="hint">接続情報はこの端末のブラウザ内に保存されます。保存したノート本文はクラウド側で管理されます。</p></section>
<section class="card hidden" id="auth"><h2>メールでログイン</h2><p class="hint">メールアドレス宛に届くリンクからログインします。初回はアカウントが自動作成されます。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="send" class="topgap">ログイン用リンクを送信</button><button class="ghost" id="reconfig">接続設定を変更</button><p class="hint" id="authMsg"></p></section>
<section id="app" class="hidden"><div class="row wrap topgap"><div class="status" id="userEmail"></div><button class="secondary" id="new">＋ 新しい作家</button></div><div class="card" id="library"><div class="row"><h2>作家一覧</h2><span class="status" id="numNotes"></span></div><div id="notes"></div></div><div class="card hidden" id="editor"><div class="row wrap"><h2 id="editorTitle">作家分析</h2><button class="ghost" id="back">一覧へ</button></div><label for="artist">作家名</label><input id="artist" placeholder="例：平田郷陽"><label for="work">代表作・参考作品（任意）</label><input id="work" placeholder="例：作品名、展示名など"><div class="row topgap"><strong>合計文字数</strong><span class="count" id="total">0 / 800字</span></div><div class="meter"><div class="fill" id="totalBar"></div></div><div id="sections"></div><div class="row wrap topgap"><span class="status" id="saveStatus">変更なし</span><div class="row wrap"><button class="secondary" id="copy">全文コピー</button><button id="save">クラウドに保存</button></div></div><div class="row topgap"><button class="danger" id="delete">この作家を削除</button></div><p class="hint">入力後、約1.2秒で自動保存します。通信が不安定なときは保存状態を確認してください。文字数は改行・空白も含みます。</p></div></section></main><div id="toast" role="status"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const defs=[['作家の概要・作風',100,'どんな作風・テーマか。他の作家との違いは？'],['作品の特徴',250,'造形、構成、色彩、質感、生命感などを具体的に。'],['自分が惹かれる理由',200,'どの作品の、どこに、なぜ惹かれる？'],['表現意図・思想',150,'作家の意図を、事実と自分の解釈を分けて考える。'],['自分の制作への応用',100,'学んだことを、次の制作でどう試す？']];
const $=id=>document.getElementById(id);let sb,user,notes=[],active=null,dirty=false,saveTimer=null,saving=false,revision=0;const configKey='artist_notes_supabase_v1';const blank=()=>({artist:'',work:'',parts:['','','','','']});
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3300)}
function count(s){return Array.from(s||'').length}function show(id){['setup','auth','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('logout').classList.toggle('hidden',id!=='app')}
function getConfig(){try{return JSON.parse(localStorage.getItem(configKey)||'null')}catch{return null}}
function connect(c){try{sb=createClient(c.url.trim(),c.key.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}catch(e){toast('接続設定を確認してください');return false}}
async function init(){let c=getConfig();if(!c){show('setup');return}if(!connect(c))return show('setup');$('url').value=c.url;$('key').value=c.key;try{const {data:{session}}=await sb.auth.getSession();await sessionChanged(session);sb.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>sessionChanged(session),0)})}catch(e){show('auth');toast('接続できませんでした')}}
async function sessionChanged(session){if(!session?.user){user=null;show('auth');return}if(user?.id===session.user.id&&$('app').classList.contains('hidden')===false)return;user=session.user;show('app');$('userEmail').textContent=user.email||'';await loadNotes()}
async function loadNotes(){const {data,error}=await sb.from('artist_notes').select('id,artist,work,parts,updated_at').order('updated_at',{ascending:false});if(error){toast('読み込み失敗：'+error.message);return}notes=data||[];renderList()}
function renderList(){$('numNotes').textContent=notes.length+'件';$('notes').replaceChildren();if(!notes.length){const p=document.createElement('p');p.className='muted';p.textContent='まだノートがありません。「新しい作家」から始めましょう。';$('notes').append(p)}notes.forEach(n=>{let div=document.createElement('div');div.className='note';let a=document.createElement('div');let title=document.createElement('strong');title.textContent=n.artist||'無題の作家';let info=document.createElement('small');info.textContent=`${(n.parts||[]).reduce((sum,p)=>sum+count(p),0)} / 800字 ・ ${new Date(n.updated_at).toLocaleDateString('ja-JP')}`;a.append(title,info);let b=document.createElement('button');b.className='secondary';b.textContent='開く';b.onclick=()=>openNote(n);div.append(a,b);$('notes').append(div)})}
function renderSections(){let el=$('sections');el.replaceChildren();defs.forEach(([title,target,hint],i)=>{let wrap=document.createElement('div');wrap.className='section';let head=document.createElement('div');head.className='sectionhead';let label=document.createElement('label');label.textContent=`${'①②③④⑤'[i]} ${title}`;label.htmlFor='part'+i;let meterText=document.createElement('span');meterText.className='count';meterText.id='count'+i;head.append(label,meterText);let t=document.createElement('textarea');t.id='part'+i;t.placeholder=hint;t.value=active.parts[i]||'';t.addEventListener('input',()=>{active.parts[i]=t.value;markDirty();updateCounts()});let bar=document.createElement('div');bar.className='meter';let fill=document.createElement('div');fill.className='fill';fill.id='bar'+i;bar.append(fill);wrap.append(head,t,bar);el.append(wrap)});updateCounts()}
function updateCounts(){let total=0;defs.forEach((d,i)=>{let n=count(active.parts[i]),goal=d[1];total+=n;$('count'+i).textContent=n+' / '+goal+'字';$('count'+i).classList.toggle('over',n>goal);$('bar'+i).style.width=Math.min(100,n/goal*100)+'%';$('bar'+i).classList.toggle('overfill',n>goal)});$('total').textContent=total+' / 800字';$('total').classList.toggle('over',total>800);$('totalBar').style.width=Math.min(100,total/800*100)+'%';$('totalBar').classList.toggle('overfill',total>800)}
function openNote(n){clearTimeout(saveTimer);active={...n,parts:[...(n.parts||blank().parts)]};while(active.parts.length<5)active.parts.push('');revision=0;dirty=false;$('artist').value=active.artist||'';$('work').value=active.work||'';$('editorTitle').textContent=active.id?'作家分析を編集':'新しい作家';$('saveStatus').textContent='変更なし';renderSections();$('library').classList.add('hidden');$('editor').classList.remove('hidden');window.scrollTo(0,0)}
function markDirty(){dirty=true;revision++;$('saveStatus').textContent='未保存の変更があります';clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNote(),1200)}
async function saveNote(){clearTimeout(saveTimer);if(!active||!dirty||saving)return;if(!active.artist.trim()){$('saveStatus').textContent='作家名を入力すると保存します';return}saving=true;let rev=revision;let payload={artist:active.artist.trim(),work:active.work||'',parts:[...active.parts],user_id:user.id};$('saveStatus').textContent='クラウドに保存中…';let res;if(active.id){res=await sb.from('artist_notes').update(payload).eq('id',active.id).select().single()}else{res=await sb.from('artist_notes').insert(payload).select().single()}saving=false;if(res.error){$('saveStatus').textContent='保存失敗：'+res.error.message;return}active.id=res.data.id;let index=notes.findIndex(n=>n.id===active.id);if(index>=0)notes[index]=res.data;else notes.unshift(res.data);dirty=revision!==rev;$('saveStatus').textContent=dirty?'新しい変更を保存中…':'クラウドに保存済み ✓';renderList();if(dirty)saveTimer=setTimeout(()=>saveNote(),300)}
$('saveConfig').onclick=async()=>{let c={url:$('url').value.trim(),key:$('key').value.trim()};if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(c.url)||!c.key){toast('URLと公開用キーを確認してください');return}localStorage.setItem(configKey,JSON.stringify(c));location.reload()};$('reconfig').onclick=()=>{localStorage.removeItem(configKey);location.reload()};$('send').onclick=async()=>{let email=$('email').value.trim();if(!email)return toast('メールアドレスを入力してください');$('send').disabled=true;let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('send').disabled=false;$('authMsg').textContent=error?'送信失敗：'+error.message:'メールを送信しました。届いたリンクをこのiPhoneで開いてください。'};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;active=null;show('auth')};$('new').onclick=()=>openNote(blank());$('artist').addEventListener('input',e=>{active.artist=e.target.value;markDirty()});$('work').addEventListener('input',e=>{active.work=e.target.value;markDirty()});$('save').onclick=()=>{if(!active.artist.trim())return toast('作家名を入力してください');if(!dirty)return toast('すでに保存済みです');saveNote()};$('back').onclick=async()=>{if(dirty){await saveNote();if(dirty)return toast('保存できていません。通信状態を確認してください')}active=null;$('editor').classList.add('hidden');$('library').classList.remove('hidden');window.scrollTo(0,0)};$('copy').onclick=async()=>{let s=`作家名：${active.artist}\n参考作品：${active.work}\n\n`+defs.map((d,i)=>`${'①②③④⑤'[i]} ${d[0]}\n${active.parts[i]}`).join('\n\n');try{await navigator.clipboard.writeText(s);toast('全文をコピーしました')}catch{toast('コピーできませんでした')}};$('delete').onclick=async()=>{if(!active.id){active=null;$('editor').classList.add('hidden');$('library').classList.remove('hidden');return}if(!confirm('この作家のノートを完全に削除しますか？'))return;const {error}=await sb.from('artist_notes').delete().eq('id',active.id);if(error)return toast('削除できません：'+error.message);notes=notes.filter(n=>n.id!==active.id);active=null;renderList();$('editor').classList.add('hidden');$('library').classList.remove('hidden');toast('削除しました')};
window.addEventListener('online',()=>{if(dirty)saveNote()});init();
</script></body></html>
